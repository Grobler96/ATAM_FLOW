name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
        working-directory: packages/engine
  dashboard:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/dashboard/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
